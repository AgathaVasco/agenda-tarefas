<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda & Tarefas — Sallus</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --azul:#2563eb; --azul-esc:#1e40af; --bg:#f1f5f9; --card:#ffffff;
    --txt:#0f172a; --txt2:#64748b; --linha:#e2e8f0;
    --alta:#dc2626; --media:#d97706; --baixa:#059669;
    --sombra:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border-radius:16px;box-shadow:var(--sombra);padding:32px;width:100%;max-width:380px}
  .login-box h1{margin:0 0 4px;font-size:22px}
  .login-box p{margin:0 0 24px;color:var(--txt2);font-size:14px}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:13px;color:var(--txt2);margin-bottom:5px}
  .campo input,.campo select,.campo textarea{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff}
  .campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--azul);border-color:transparent}
  .btn{background:var(--azul);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:600;width:100%;font-size:15px}
  .btn:hover{background:var(--azul-esc)}
  .btn-sec{background:#fff;color:var(--txt);border:1px solid var(--linha)}
  .btn-sec:hover{background:#f8fafc}
  .erro{color:var(--alta);font-size:13px;margin-top:10px;min-height:18px}

  /* ---------- APP ---------- */
  #app{display:none;max-width:900px;margin:0 auto;padding-bottom:80px}
  header{background:var(--card);border-bottom:1px solid var(--linha);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  header .logo{font-weight:700;font-size:17px;color:var(--azul)}
  header .quem{margin-left:auto;font-size:13px;color:var(--txt2);text-align:right;line-height:1.3}
  header .sair{background:none;border:1px solid var(--linha);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--txt2)}

  nav{display:flex;gap:6px;background:var(--card);padding:8px 12px;border-bottom:1px solid var(--linha);position:sticky;top:53px;z-index:19}
  nav button{flex:1;background:none;border:none;padding:10px;border-radius:10px;font-weight:600;color:var(--txt2);font-size:14px}
  nav button.on{background:var(--azul);color:#fff}

  .conteudo{padding:16px 18px}
  .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--linha);border-radius:20px;padding:7px 13px;font-size:13px;color:var(--txt2)}
  .chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .add{margin-left:auto;background:var(--azul);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap}
  .add:hover{background:var(--azul-esc)}

  /* ---------- CARDS DE TAREFA ---------- */
  .grupo-titulo{font-size:13px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px}
  .tarefa{background:var(--card);border:1px solid var(--linha);border-left:4px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--sombra)}
  .tarefa.p-alta{border-left-color:var(--alta)}
  .tarefa.p-media{border-left-color:var(--media)}
  .tarefa.p-baixa{border-left-color:var(--baixa)}
  .tarefa.feita{opacity:.6}
  .tarefa.feita .t-titulo{text-decoration:line-through}
  .t-topo{display:flex;align-items:flex-start;gap:10px}
  .t-titulo{font-weight:600;font-size:15px;flex:1}
  .t-desc{color:var(--txt2);font-size:13px;margin-top:4px;white-space:pre-wrap}
  .t-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .tag{font-size:12px;padding:3px 9px;border-radius:6px;background:#f1f5f9;color:var(--txt2)}
  .tag.cli{background:#eff6ff;color:var(--azul)}
  .tag.hoje{background:#fef3c7;color:#92400e;font-weight:600}
  .tag.atrasada{background:#fee2e2;color:#991b1b;font-weight:600}
  .tag.resp{background:#f0fdf4;color:#166534}
  .t-status{border:1px solid var(--linha);border-radius:8px;padding:6px 8px;font-size:13px;background:#fff}
  .t-acoes{display:flex;gap:6px;margin-left:auto}
  .icon-btn{background:none;border:none;font-size:16px;padding:4px;color:var(--txt2);border-radius:6px}
  .icon-btn:hover{background:#f1f5f9}
  .vazio{text-align:center;color:var(--txt2);padding:50px 20px}
  .vazio .em{font-size:40px;margin-bottom:8px}

  /* ---------- ANOTAÇÕES ---------- */
  .nota{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--sombra)}
  .nota h3{margin:0 0 4px;font-size:15px}
  .nota .n-conteudo{color:var(--txt);font-size:14px;white-space:pre-wrap;margin-top:8px;line-height:1.5}
  .nota .n-meta{font-size:12px;color:var(--txt2);margin-top:10px;display:flex;gap:8px;align-items:center}

  /* ---------- CONTAS FIXAS ---------- */
  .mes-nav{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .mes-nav .icon-btn{font-size:15px;border:1px solid var(--linha);border-radius:8px;padding:5px 10px}
  .empresa-bloco{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--sombra)}
  .empresa-topo{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .empresa-topo h3{margin:0;font-size:16px;flex:1}
  .empresa-totais{font-size:13px;color:var(--txt2);text-align:right;line-height:1.4}
  .empresa-totais b{color:var(--txt)}
  .conta{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--linha);flex-wrap:wrap}
  .conta .c-nome{font-weight:600;flex:1;min-width:120px}
  .conta .c-nome small{display:block;font-weight:400;color:var(--txt2);font-size:12px}
  .conta .c-valor{font-weight:600;white-space:nowrap}
  .venc{font-size:12px;padding:3px 9px;border-radius:6px;background:#f1f5f9;color:var(--txt2);white-space:nowrap}
  .venc.hoje{background:#fef3c7;color:#92400e;font-weight:600}
  .venc.breve{background:#fef9c3;color:#854d0e}
  .venc.vencida{background:#fee2e2;color:#991b1b;font-weight:600}
  .venc.paga{background:#dcfce7;color:#166534;font-weight:600}
  .btn-pagar{background:#059669;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .btn-pagar:hover{background:#047857}
  .btn-pago{background:#dcfce7;color:#166534;border:1px solid #86efac;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}

  /* ---------- TELA INÍCIO ---------- */
  .saudacao{margin-bottom:14px}
  .saudacao h2{margin:0;font-size:20px}
  .saudacao p{margin:2px 0 0;color:var(--txt2);font-size:14px}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px;box-shadow:var(--sombra);cursor:pointer;border-left:4px solid var(--azul)}
  .tile:hover{background:#f8fafc}
  .tile.t-vermelho{border-left-color:var(--alta)}
  .tile.t-laranja{border-left-color:var(--media)}
  .tile.t-verde{border-left-color:var(--baixa)}
  .tile .num{font-size:24px;font-weight:700;line-height:1}
  .tile .rot{font-size:12px;color:var(--txt2);margin-top:4px}
  @media(max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr)} }

  .secao-titulo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--txt);margin:22px 0 10px}

  .cal-wrap{position:relative;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:14px;box-shadow:var(--sombra)}
  .cal-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:12px}
  .cal-head .icon-btn{border:1px solid var(--linha);border-radius:8px;padding:4px 10px}
  .btn-hoje{margin-left:auto;background:#eff6ff;color:var(--azul);border:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--txt2);padding:4px 0;text-transform:uppercase}
  .cal-cell{min-height:52px;border-radius:9px;padding:5px 4px;font-size:13px;position:relative;border:1px solid transparent;background:#f8fafc}
  .cal-cell.vazia{background:transparent}
  .cal-cell.tem{cursor:pointer;background:#fff;border-color:var(--linha)}
  .cal-cell.tem:hover{border-color:var(--azul);box-shadow:0 0 0 2px #dbeafe}
  .cal-cell.hoje{background:#eff6ff;border-color:var(--azul);font-weight:700}
  .cal-cell .dnum{font-size:12px;color:var(--txt2)}
  .cal-cell.hoje .dnum{color:var(--azul)}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.alta{background:var(--alta)} .dot.media{background:var(--media)} .dot.baixa{background:var(--baixa)}
  .cal-cnt{position:absolute;top:4px;right:5px;font-size:10px;font-weight:700;color:var(--azul)}
  .cal-money{position:absolute;bottom:4px;right:5px;font-size:11px}

  .cal-pop{position:absolute;z-index:40;background:#fff;border:1px solid var(--linha);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:12px;width:250px;max-width:80vw}
  .cal-pop h4{margin:0 0 8px;font-size:14px}
  .cal-pop .pitem{font-size:13px;padding:5px 0;border-top:1px solid var(--linha);display:flex;gap:6px;align-items:flex-start}
  .cal-pop .pitem:first-of-type{border-top:none}
  .cal-pop .pdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}

  .semana{display:flex;flex-direction:column;gap:8px}
  .semana-dia{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra)}
  .semana-dia.hoje{border-color:var(--azul);background:#f8fbff}
  .semana-dia .sd-topo{font-size:13px;font-weight:700;margin-bottom:7px;text-transform:capitalize;display:flex;align-items:center;gap:8px}
  .semana-dia .sd-topo .qtd{margin-left:auto;font-weight:400;color:var(--txt2);font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip-t{font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid;display:inline-flex;gap:5px;align-items:center;cursor:pointer}
  .chip-t.pessoa-gestora{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .chip-t.pessoa-estagiaria{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  .chip-t.pessoa-nenhum{background:#f1f5f9;border-color:var(--linha);color:var(--txt2)}
  .chip-t.feita{opacity:.5;text-decoration:line-through}
  .chip-t.conta{background:#fffbeb;border-color:#fde68a;color:#92400e;cursor:default}
  .sd-vazio{font-size:12px;color:var(--txt2)}

  .dois-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:640px){ .dois-cols{grid-template-columns:1fr} }
  .mini{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sombra);display:flex;align-items:center;gap:10px}
  .mini .mi-nome{flex:1;font-size:14px}
  .mini .mi-nome small{display:block;color:var(--txt2);font-size:12px}
  .mini .mi-val{font-weight:600;font-size:13px;white-space:nowrap}
  .mini .mi-tag{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .mini .mi-tag.pend{background:#fef3c7;color:#92400e}
  .mini .mi-tag.pago{background:#dcfce7;color:#166534}

  /* ---------- MODAL ---------- */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;align-items:flex-end;justify-content:center;padding:0}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px}
  .modal h2{margin:0 0 18px;font-size:18px}
  .modal .linha2{display:flex;gap:10px}
  .modal .linha2>*{flex:1}
  .modal-acoes{display:flex;gap:10px;margin-top:8px}
  @media(min-width:560px){ .modal-bg{align-items:center} .modal{border-radius:18px} }

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
</style>

<!-- ============ TELA DE LOGIN ============ -->
<div id="login">
  <div class="login-box">
    <h1>Agenda &amp; Tarefas</h1>
    <p>Sallus Assessoria Contábil</p>
    <div class="campo"><label>E-mail</label><input id="lg-email" type="email" autocomplete="username"></div>
    <div class="campo"><label>Senha</label><input id="lg-senha" type="password" autocomplete="current-password"></div>
    <button class="btn" onclick="entrar()">Entrar</button>
    <div class="erro" id="lg-erro"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <span class="logo">📋 Agenda &amp; Tarefas</span>
    <div class="quem"><span id="me-nome"></span><br><span id="me-papel"></span></div>
    <button class="sair" onclick="sair()">Sair</button>
  </header>

  <nav>
    <button id="nav-inicio" class="on" onclick="verAba('inicio')">🏠 Início</button>
    <button id="nav-tarefas" onclick="verAba('tarefas')">✓ Tarefas</button>
    <button id="nav-contas" onclick="verAba('contas')">💰 Contas</button>
    <button id="nav-notas" onclick="verAba('notas')">📝 Notas</button>
  </nav>

  <!-- ABA INÍCIO -->
  <div class="conteudo" id="aba-inicio">
    <div id="saudacao" class="saudacao"></div>
    <div id="tiles" class="tiles"></div>

    <div class="cal-wrap">
      <div class="cal-head">
        <button class="icon-btn" onclick="calMudarMes(-1)">◀</button>
        <span id="cal-label"></span>
        <button class="icon-btn" onclick="calMudarMes(1)">▶</button>
        <button class="btn-hoje" onclick="calHoje()">Hoje</button>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="cal-pop" class="cal-pop" hidden></div>
    </div>

    <div class="secao-titulo">📆 Fluxo da semana
      <div class="filtros" id="filtros-semana" style="margin-left:auto"></div>
    </div>
    <div id="semana" class="semana"></div>

    <div class="dois-cols">
      <div>
        <div class="secao-titulo">✓ Tarefas de hoje</div>
        <div id="hoje-lista"></div>
      </div>
      <div>
        <div class="secao-titulo">💰 Próximos vencimentos</div>
        <div id="venc-lista"></div>
      </div>
    </div>
  </div>

  <!-- ABA TAREFAS -->
  <div class="conteudo" id="aba-tarefas" style="display:none">
    <div class="barra">
      <div class="filtros" id="filtros-quando">
        <button class="chip on" data-q="hoje" onclick="setFiltro('quando','hoje')">Hoje &amp; atrasadas</button>
        <button class="chip" data-q="semana" onclick="setFiltro('quando','semana')">Esta semana</button>
        <button class="chip" data-q="todas" onclick="setFiltro('quando','todas')">Todas abertas</button>
        <button class="chip" data-q="concluidas" onclick="setFiltro('quando','concluidas')">Concluídas</button>
      </div>
      <button class="add" onclick="abrirTarefa()">+ Nova tarefa</button>
    </div>
    <div class="filtros" id="filtros-quem" style="margin-bottom:16px">
      <button class="chip on" data-r="todos" onclick="setFiltro('quem','todos')">Todos</button>
      <button class="chip" data-r="minhas" onclick="setFiltro('quem','minhas')">Minhas</button>
      <button class="chip" data-r="equipe" onclick="setFiltro('quem','equipe')">Da equipe</button>
    </div>
    <div id="lista-tarefas"></div>
  </div>

  <!-- ABA CONTAS FIXAS -->
  <div class="conteudo" id="aba-contas" style="display:none">
    <div class="barra">
      <div class="mes-nav">
        <button class="icon-btn" onclick="mudarMes(-1)">◀</button>
        <span id="mes-label"></span>
        <button class="icon-btn" onclick="mudarMes(1)">▶</button>
      </div>
      <button class="add" onclick="abrirConta()">+ Nova conta</button>
    </div>
    <div id="resumo-contas"></div>
    <div id="lista-contas"></div>
  </div>

  <!-- ABA ANOTAÇÕES -->
  <div class="conteudo" id="aba-notas" style="display:none">
    <div class="barra">
      <div class="campo" style="flex:1;margin:0"><input id="busca-nota" placeholder="🔍 Buscar por cliente ou título..." oninput="renderNotas()"></div>
      <button class="add" onclick="abrirNota()">+ Nova anotação</button>
    </div>
    <div id="lista-notas"></div>
  </div>
</div>

<!-- ============ MODAL TAREFA ============ -->
<div class="modal-bg" id="modal-tarefa">
  <div class="modal">
    <h2 id="mt-titulo">Nova tarefa</h2>
    <input type="hidden" id="t-id">
    <div class="campo"><label>Título *</label><input id="t-titulo" placeholder="Ex: Enviar guias do Simples"></div>
    <div class="campo"><label>Descrição / passo-a-passo</label><textarea id="t-descricao" rows="3" placeholder="Detalhes, links, observações..."></textarea></div>
    <div class="campo"><label>Cliente</label><input id="t-cliente" list="lista-clientes" placeholder="Ex: Acelera Corretora"></div>
    <div class="linha2">
      <div class="campo"><label>Responsável</label><select id="t-responsavel"></select></div>
      <div class="campo"><label>Prioridade</label><select id="t-prioridade">
        <option value="alta">🔴 Alta</option><option value="media" selected>🟠 Média</option><option value="baixa">🟢 Baixa</option>
      </select></div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Prazo</label><input id="t-prazo" type="date"></div>
      <div class="campo"><label>Hora (opcional)</label><input id="t-hora" type="time"></div>
    </div>
    <div class="campo"><label>Repetir</label><select id="t-recorrencia">
      <option value="nenhuma">Não repete</option>
      <option value="diaria">Todo dia</option>
      <option value="semanal">Toda semana</option>
      <option value="mensal">Todo mês (mesmo dia)</option>
      <option value="anual">Todo ano</option>
    </select></div>
    <div class="modal-acoes">
      <button class="btn btn-sec" onclick="fechar('modal-tarefa')">Cancelar</button>
      <button class="btn" onclick="salvarTarefa()">Salvar</button>
    </div>
    <button class="btn btn-sec" id="mt-apagar" style="margin-top:10px;color:var(--alta)" onclick="apagarTarefa()">Excluir tarefa</button>
  </div>
</div>

<!-- ============ MODAL NOTA ============ -->
<div class="modal-bg" id="modal-nota">
  <div class="modal">
    <h2 id="mn-titulo">Nova anotação</h2>
    <input type="hidden" id="n-id">
    <div class="campo"><label>Cliente</label><input id="n-cliente" list="lista-clientes" placeholder="Ex: P4H Saúde"></div>
    <div class="campo"><label>Título</label><input id="n-titulo" placeholder="Ex: Passo-a-passo fechamento mensal"></div>
    <div class="campo"><label>Conteúdo</label><textarea id="n-conteudo" rows="8" placeholder="Anote aqui dados do cliente, senhas de portais (com cuidado), passo-a-passo de rotinas..."></textarea></div>
    <div class="campo"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="n-privada" style="width:auto"> Anotação privada (só eu vejo)</label></div>
    <div class="modal-acoes">
      <button class="btn btn-sec" onclick="fechar('modal-nota')">Cancelar</button>
      <button class="btn" onclick="salvarNota()">Salvar</button>
    </div>
    <button class="btn btn-sec" id="mn-apagar" style="margin-top:10px;color:var(--alta)" onclick="apagarNota()">Excluir anotação</button>
  </div>
</div>

<script>
/* ============================================================
   >>> CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase <<<
   (Supabase → Project Settings → API)
   ============================================================ */
const SUPABASE_URL  = "https://dqbygkhvefcqgzdztjkd.supabase.co";
const SUPABASE_ANON = "sb_publishable_xLPFi73KdlM4qCb34stzkw_magqDqpk";
/* ============================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let EU = null;          // meu perfil
let PERFIS = [];        // todos os perfis (para o dropdown de responsável)
let TAREFAS = [];
let NOTAS = [];
let CONTAS = [];        // contas fixas
let PAG_ALL = [];       // todos os pagamentos (histórico completo)
let PAGAMENTOS = [];    // pagamentos do mês selecionado (aba Contas)
let filtros = { quando:'hoje', quem:'todos' };
let mesSel = null;      // competência selecionada nas Contas Fixas (AAAA-MM)
let calMes = null;      // mês exibido no calendário do Início
let semanaFiltro = 'todos'; // filtro do fluxo da semana

/* ---------- Datas ---------- */
function hojeISO(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'America/Sao_Paulo'}); // AAAA-MM-DD
}
function fmtData(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}
function proximaData(iso, recor){
  const d = new Date(iso + 'T12:00:00');
  if(recor==='diaria')  d.setDate(d.getDate()+1);
  else if(recor==='semanal') d.setDate(d.getDate()+7);
  else if(recor==='mensal')  d.setMonth(d.getMonth()+1);
  else if(recor==='anual')   d.setFullYear(d.getFullYear()+1);
  else return null;
  return d.toISOString().slice(0,10);
}
function mesAtual(){ return hojeISO().slice(0,7); } // AAAA-MM
function fmtMoeda(v){
  if(v===null || v===undefined || v==='') return '—';
  return Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function nomeMes(comp){
  const [a,m] = comp.split('-');
  const meses = ['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${meses[+m]} de ${a}`;
}
function diasNoMes(comp){ const [a,m]=comp.split('-').map(Number); return new Date(a, m, 0).getDate(); }
function dataVencimento(comp, dia){ // devolve AAAA-MM-DD, ajustando dia ao tamanho do mês
  const d = Math.min(dia, diasNoMes(comp));
  return `${comp}-${String(d).padStart(2,'0')}`;
}

/* ---------- Toast ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

/* ============================================================
   LOGIN
   ============================================================ */
async function entrar(){
  const email = document.getElementById('lg-email').value.trim();
  const senha = document.getElementById('lg-senha').value;
  const erro  = document.getElementById('lg-erro');
  erro.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ erro.textContent = 'E-mail ou senha incorretos.'; return; }
  iniciar();
}
async function sair(){ await sb.auth.signOut(); location.reload(); }

async function iniciar(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ return; }

  // carrega perfis
  const { data:perfis } = await sb.from('perfis').select('*').order('papel');
  PERFIS = perfis || [];
  EU = PERFIS.find(p => p.id === user.id) || { id:user.id, nome:user.email, papel:'estagiaria' };

  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('me-nome').textContent = EU.nome || user.email;
  document.getElementById('me-papel').textContent = EU.papel === 'gestora' ? 'Gestora' : 'Estagiária';

  // preenche dropdown de responsável
  const sel = document.getElementById('t-responsavel');
  sel.innerHTML = PERFIS.map(p => `<option value="${p.id}">${p.nome||p.email||'—'}</option>`).join('');

  await carregarTudo();
}

async function carregarTudo(){
  if(!mesSel) mesSel = mesAtual();
  if(!calMes) calMes = mesAtual();
  const [{ data:t }, { data:n }, { data:c }, { data:pg }] = await Promise.all([
    sb.from('tarefas').select('*').order('prazo', {nullsFirst:false}).order('prioridade'),
    sb.from('notas').select('*').order('atualizado_em', {ascending:false}),
    sb.from('contas_fixas').select('*').order('dia_vencimento'),
    sb.from('pagamentos').select('*')
  ]);
  TAREFAS = t || [];
  NOTAS = n || [];
  CONTAS = c || [];
  PAG_ALL = pg || [];
  PAGAMENTOS = PAG_ALL.filter(p=>p.competencia===mesSel);
  atualizarClientes();
  renderInicio();
  renderTarefas();
  renderNotas();
  renderContas();
}
function pagoDe(contaId, comp){ return PAG_ALL.find(p=>p.conta_fixa_id===contaId && p.competencia===comp) || null; }

function atualizarClientes(){
  const set = new Set();
  TAREFAS.forEach(t=> t.cliente && set.add(t.cliente));
  NOTAS.forEach(n=> n.cliente && set.add(n.cliente));
  document.getElementById('lista-clientes').innerHTML =
    [...set].sort().map(c=>`<option value="${c}">`).join('');
  const emp = new Set();
  CONTAS.forEach(c=> c.empresa && emp.add(c.empresa));
  document.getElementById('lista-empresas').innerHTML =
    [...emp].sort().map(e=>`<option value="${e}">`).join('');
}

/* ============================================================
   NAVEGAÇÃO / FILTROS
   ============================================================ */
function verAba(aba){
  document.getElementById('aba-inicio').style.display  = aba==='inicio' ? 'block':'none';
  document.getElementById('aba-tarefas').style.display = aba==='tarefas' ? 'block':'none';
  document.getElementById('aba-contas').style.display  = aba==='contas' ? 'block':'none';
  document.getElementById('aba-notas').style.display   = aba==='notas' ? 'block':'none';
  document.getElementById('nav-inicio').classList.toggle('on', aba==='inicio');
  document.getElementById('nav-tarefas').classList.toggle('on', aba==='tarefas');
  document.getElementById('nav-contas').classList.toggle('on', aba==='contas');
  document.getElementById('nav-notas').classList.toggle('on', aba==='notas');
  fecharPop();
}
function setFiltro(tipo, valor){
  filtros[tipo] = valor;
  const grupo = tipo==='quando' ? 'filtros-quando' : 'filtros-quem';
  document.querySelectorAll(`#${grupo} .chip`).forEach(c=>{
    const v = c.dataset.q || c.dataset.r;
    c.classList.toggle('on', v===valor);
  });
  renderTarefas();
}

/* ============================================================
   RENDER TAREFAS
   ============================================================ */
function nomeDe(id){ const p = PERFIS.find(x=>x.id===id); return p ? (p.nome||p.email) : '—'; }

function renderTarefas(){
  const hoje = hojeISO();
  const daquiUmaSemana = new Date(); daquiUmaSemana.setDate(daquiUmaSemana.getDate()+7);
  const semanaISO = daquiUmaSemana.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});

  let lista = TAREFAS.slice();

  // filtro por responsável
  if(filtros.quem==='minhas') lista = lista.filter(t=>t.responsavel_id===EU.id);
  else if(filtros.quem==='equipe') lista = lista.filter(t=>t.responsavel_id && t.responsavel_id!==EU.id);

  // filtro por período/status
  if(filtros.quando==='concluidas'){
    lista = lista.filter(t=>t.status==='concluida');
  } else {
    lista = lista.filter(t=>t.status!=='concluida');
    if(filtros.quando==='hoje')
      lista = lista.filter(t=> t.prazo && t.prazo<=hoje);
    else if(filtros.quando==='semana')
      lista = lista.filter(t=> t.prazo && t.prazo<=semanaISO);
    // 'todas' = todas as abertas
  }

  const box = document.getElementById('lista-tarefas');
  if(!lista.length){
    box.innerHTML = `<div class="vazio"><div class="em">🎉</div>Nenhuma tarefa aqui. Aproveite!</div>`;
    return;
  }

  // ordena: atrasada/hoje primeiro, depois por prazo, depois prioridade
  const pesoP = {alta:0, media:1, baixa:2};
  lista.sort((a,b)=>{
    const pa = a.prazo||'9999', pb = b.prazo||'9999';
    if(pa!==pb) return pa<pb?-1:1;
    return pesoP[a.prioridade]-pesoP[b.prioridade];
  });

  box.innerHTML = lista.map(t=>cardTarefa(t, hoje)).join('');
}

function cardTarefa(t, hoje){
  let badge = '';
  if(t.status!=='concluida' && t.prazo){
    if(t.prazo < hoje) badge = `<span class="tag atrasada">⚠ Atrasada · ${fmtData(t.prazo)}</span>`;
    else if(t.prazo===hoje) badge = `<span class="tag hoje">📅 Hoje${t.hora?' · '+t.hora.slice(0,5):''}</span>`;
    else badge = `<span class="tag">📅 ${fmtData(t.prazo)}${t.hora?' · '+t.hora.slice(0,5):''}</span>`;
  }
  const recor = t.recorrencia && t.recorrencia!=='nenhuma' ? `<span class="tag">🔁 ${({diaria:'Diária',semanal:'Semanal',mensal:'Mensal',anual:'Anual'})[t.recorrencia]}</span>` : '';
  const feita = t.status==='concluida';
  return `
  <div class="tarefa p-${t.prioridade} ${feita?'feita':''}">
    <div class="t-topo">
      <div style="flex:1" onclick="abrirTarefa('${t.id}')">
        <div class="t-titulo">${escapar(t.titulo)}</div>
        ${t.descricao?`<div class="t-desc">${escapar(t.descricao)}</div>`:''}
      </div>
      <div class="t-acoes">
        <button class="icon-btn" title="Editar" onclick="abrirTarefa('${t.id}')">✏️</button>
      </div>
    </div>
    <div class="t-tags">
      ${badge}
      ${t.cliente?`<span class="tag cli">🏢 ${escapar(t.cliente)}</span>`:''}
      <span class="tag resp">👤 ${escapar(nomeDe(t.responsavel_id))}</span>
      ${recor}
      <select class="t-status" onchange="mudarStatus('${t.id}', this.value)">
        <option value="a_fazer" ${t.status==='a_fazer'?'selected':''}>◻️ A fazer</option>
        <option value="fazendo" ${t.status==='fazendo'?'selected':''}>🔵 Fazendo</option>
        <option value="concluida" ${t.status==='concluida'?'selected':''}>✅ Concluída</option>
      </select>
    </div>
  </div>`;
}

function escapar(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Mudar status (com repetição) ---------- */
async function mudarStatus(id, novo){
  const t = TAREFAS.find(x=>x.id===id);
  if(!t) return;

  // Se concluiu uma tarefa que se repete → agenda a próxima em vez de fechar
  if(novo==='concluida' && t.recorrencia && t.recorrencia!=='nenhuma' && t.prazo){
    const prox = proximaData(t.prazo, t.recorrencia);
    await sb.from('tarefas').update({ prazo:prox, status:'a_fazer', atualizado_em:new Date().toISOString() }).eq('id', id);
    toast(`Feito! Próxima: ${fmtData(prox)} 🔁`);
  } else {
    const patch = { status:novo, atualizado_em:new Date().toISOString() };
    patch.concluida_em = novo==='concluida' ? new Date().toISOString() : null;
    await sb.from('tarefas').update(patch).eq('id', id);
    if(novo==='concluida') toast('Tarefa concluída! ✅');
  }
  await carregarTudo();
}

/* ---------- Modal tarefa ---------- */
function abrirTarefa(id){
  const m = document.getElementById('modal-tarefa');
  const t = id ? TAREFAS.find(x=>x.id===id) : null;
  document.getElementById('mt-titulo').textContent = t ? 'Editar tarefa' : 'Nova tarefa';
  document.getElementById('t-id').value          = t ? t.id : '';
  document.getElementById('t-titulo').value       = t ? t.titulo : '';
  document.getElementById('t-descricao').value    = t ? (t.descricao||'') : '';
  document.getElementById('t-cliente').value      = t ? (t.cliente||'') : '';
  document.getElementById('t-responsavel').value  = t ? (t.responsavel_id||EU.id) : EU.id;
  document.getElementById('t-prioridade').value   = t ? t.prioridade : 'media';
  document.getElementById('t-prazo').value        = t ? (t.prazo||'') : hojeISO();
  document.getElementById('t-hora').value         = t ? (t.hora? t.hora.slice(0,5):'') : '';
  document.getElementById('t-recorrencia').value  = t ? t.recorrencia : 'nenhuma';
  document.getElementById('mt-apagar').style.display = t ? 'block' : 'none';
  m.classList.add('show');
}

async function salvarTarefa(){
  const id = document.getElementById('t-id').value;
  const titulo = document.getElementById('t-titulo').value.trim();
  if(!titulo){ toast('Escreva um título 🙂'); return; }
  const dados = {
    titulo,
    descricao:   document.getElementById('t-descricao').value.trim() || null,
    cliente:     document.getElementById('t-cliente').value.trim() || null,
    responsavel_id: document.getElementById('t-responsavel').value,
    prioridade:  document.getElementById('t-prioridade').value,
    prazo:       document.getElementById('t-prazo').value || null,
    hora:        document.getElementById('t-hora').value || null,
    recorrencia: document.getElementById('t-recorrencia').value,
    atualizado_em: new Date().toISOString()
  };
  let error;
  if(id){
    ({ error } = await sb.from('tarefas').update(dados).eq('id', id));
  } else {
    dados.criado_por = EU.id;
    ({ error } = await sb.from('tarefas').insert(dados));
  }
  if(error){ toast('Erro ao salvar 😕'); console.error(error); return; }
  fechar('modal-tarefa');
  await carregarTudo();
  toast(id ? 'Tarefa atualizada!' : 'Tarefa criada!');
}

async function apagarTarefa(){
  const id = document.getElementById('t-id').value;
  if(!id) return;
  if(!confirm('Excluir esta tarefa? Não dá pra desfazer.')) return;
  await sb.from('tarefas').delete().eq('id', id);
  fechar('modal-tarefa');
  await carregarTudo();
  toast('Tarefa excluída.');
}

/* ============================================================
   ANOTAÇÕES
   ============================================================ */
function renderNotas(){

function abrirNota(id){
  const n = id ? NOTAS.find(x=>x.id===id) : null;

  };

  if(error){ toast('Erro ao salvar 😕'); console.error(error); return; }

/* ============================================================
   CONTAS FIXAS
   ============================================================ */
function diffDias(isoA, isoB){ return Math.round((new Date(isoB+'T12:00:00') - new Date(isoA+'T12:00:00'))/86400000); }

function mudarMes(delta){
  let [a,m] = mesSel.split('-').map(Number);
  m += delta;
  if(m<1){ m=12; a--; } if(m>12){ m=1; a++; }
  mesSel = `${a}-${String(m).padStart(2,'0')}`;
  carregarTudo();
}

function renderContas(){
  document.getElementById('mes-label').textContent = nomeMes(mesSel);
  const box = document.getElementById('lista-contas');
  const resumo = document.getElementById('resumo-contas');

  if(!CONTAS.length){
    resumo.innerHTML = '';
    box.innerHTML = `<div class="vazio"><div class="em">💰</div>Nenhuma conta fixa cadastrada ainda.<br>Clique em <b>+ Nova conta</b> para começar.</div>`;
    return;
  }

  const hoje = hojeISO();
  const ehMesAtual = (mesSel === mesAtual());

  // agrupa por empresa
  const grupos = {};
  CONTAS.forEach(c=>{ const e = c.empresa||'Sem empresa'; (grupos[e]=grupos[e]||[]).push(c); });

  // resumo geral (todas as empresas)
  let totPrev=0, totPago=0;
  CONTAS.forEach(c=>{
    totPrev += Number(c.valor_previsto)||0;
    const pg = PAGAMENTOS.find(p=>p.conta_fixa_id===c.id);
    if(pg) totPago += Number(pg.valor_pago)||0;
  });
  resumo.innerHTML = `<div class="empresa-totais" style="text-align:left;margin-bottom:8px;font-size:14px">
    Total previsto no mês: <b>${fmtMoeda(totPrev)}</b> · já pago: <b style="color:#059669">${fmtMoeda(totPago)}</b></div>`;

  box.innerHTML = Object.keys(grupos).sort().map(emp=>{
    const contas = grupos[emp].sort((a,b)=>(a.dia_vencimento||0)-(b.dia_vencimento||0));
    let prev=0, pago=0;
    contas.forEach(c=>{
      prev += Number(c.valor_previsto)||0;
      const pg = PAGAMENTOS.find(p=>p.conta_fixa_id===c.id);
      if(pg) pago += Number(pg.valor_pago)||0;
    });
    return `
    <div class="empresa-bloco">
      <div class="empresa-topo">
        <h3>🏢 ${escapar(emp)}</h3>
        <div class="empresa-totais">Previsto: <b>${fmtMoeda(prev)}</b><br>Pago: <b style="color:#059669">${fmtMoeda(pago)}</b></div>
      </div>
      ${contas.map(c=>linhaConta(c, hoje, ehMesAtual)).join('')}
    </div>`;
  }).join('');
}

function linhaConta(c, hoje, ehMesAtual){
  const venc = dataVencimento(mesSel, c.dia_vencimento);
  const pg = PAGAMENTOS.find(p=>p.conta_fixa_id===c.id);
  let badge, acao;

  if(pg){
    badge = `<span class="venc paga">✅ Pago ${pg.pago_em?'· '+fmtData(pg.pago_em):''}</span>`;
    acao = `<button class="btn-pago" onclick="abrirPagamento('${c.id}')">${fmtMoeda(pg.valor_pago)} ✓</button>`;
  } else {
    if(!ehMesAtual && mesSel < mesAtual())      badge = `<span class="venc vencida">Não paga · venceu ${fmtData(venc)}</span>`;
    else if(!ehMesAtual && mesSel > mesAtual()) badge = `<span class="venc">Vence dia ${c.dia_vencimento}</span>`;
    else { // mês atual
      const d = diffDias(hoje, venc);
      if(d < 0)       badge = `<span class="venc vencida">⚠ Vencida · ${fmtData(venc)}</span>`;
      else if(d===0)  badge = `<span class="venc hoje">📅 Vence hoje</span>`;
      else if(d <= (c.avisar_dias_antes??3)) badge = `<span class="venc breve">⏰ Vence em ${d} dia${d>1?'s':''}</span>`;
      else            badge = `<span class="venc">Vence dia ${c.dia_vencimento}</span>`;
    }
    acao = `<button class="btn-pagar" onclick="abrirPagamento('${c.id}')">Registrar pagamento</button>`;
  }

  return `
  <div class="conta">
    <div class="c-nome">${escapar(c.nome)}${c.categoria?`<small>${escapar(c.categoria)}</small>`:''}</div>
    ${badge}
    <span class="c-valor">${fmtMoeda(c.valor_previsto)}</span>
    ${acao}
    <button class="icon-btn" title="Editar conta" onclick="abrirConta('${c.id}')">✏️</button>
  </div>`;
}

/* ---------- Modal conta fixa ---------- */
function abrirConta(id){
  const c = id ? CONTAS.find(x=>x.id===id) : null;
  document.getElementById('mc-titulo').textContent = c ? 'Editar conta fixa' : 'Nova conta fixa';
  document.getElementById('c-id').value        = c ? c.id : '';
  document.getElementById('c-empresa').value   = c ? (c.empresa||'') : '';
  document.getElementById('c-nome').value      = c ? (c.nome||'') : '';
  document.getElementById('c-dia').value       = c ? (c.dia_vencimento||'') : '';
  document.getElementById('c-valor').value     = c ? (c.valor_previsto??'') : '';
  document.getElementById('c-categoria').value = c ? (c.categoria||'') : '';
  document.getElementById('c-aviso').value     = c ? (c.avisar_dias_antes??3) : 3;
  document.getElementById('mc-apagar').style.display = c ? 'block' : 'none';
  document.getElementById('modal-conta').classList.add('show');
}

async function salvarConta(){
  const id = document.getElementById('c-id').value;
  const empresa = document.getElementById('c-empresa').value.trim();
  const nome = document.getElementById('c-nome').value.trim();
  const dia = parseInt(document.getElementById('c-dia').value, 10);
  if(!empresa){ toast('Informe a empresa 🙂'); return; }
  if(!nome){ toast('Informe o nome da despesa 🙂'); return; }
  if(!dia || dia<1 || dia>31){ toast('Dia do vencimento entre 1 e 31'); return; }
  const valor = document.getElementById('c-valor').value;
  const dados = {
    empresa, nome,
    dia_vencimento: dia,
    valor_previsto: valor==='' ? null : Number(valor),
    categoria: document.getElementById('c-categoria').value.trim() || null,
    avisar_dias_antes: parseInt(document.getElementById('c-aviso').value,10) || 0
  };
  let error;
  if(id){
    ({ error } = await sb.from('contas_fixas').update(dados).eq('id', id));
  } else {
    dados.criado_por = EU.id;
    ({ error } = await sb.from('contas_fixas').insert(dados));
  }
  if(error){ toast('Erro ao salvar 😕'); console.error(error); return; }
  fechar('modal-conta');
  await carregarTudo();
  toast(id ? 'Conta atualizada!' : 'Conta cadastrada!');
}

async function apagarConta(){
  const id = document.getElementById('c-id').value;
  if(!id) return;
  if(!confirm('Excluir esta conta fixa? Todo o histórico de pagamentos dela também será apagado.')) return;
  await sb.from('contas_fixas').delete().eq('id', id);
  fechar('modal-conta');
  await carregarTudo();
  toast('Conta excluída.');
}

/* ---------- Modal pagamento ---------- */
function abrirPagamento(contaId){
  const c = CONTAS.find(x=>x.id===contaId);
  if(!c) return;
  const pg = PAGAMENTOS.find(p=>p.conta_fixa_id===contaId);
  document.getElementById('pg-conta-id').value = contaId;
  document.getElementById('pg-id').value = pg ? pg.id : '';
  document.getElementById('mp-titulo').textContent = pg ? 'Pagamento registrado' : 'Registrar pagamento';
  document.getElementById('pg-info').textContent = `${c.nome} · ${c.empresa} · ${nomeMes(mesSel)}`;
  document.getElementById('pg-valor').value = pg ? (pg.valor_pago??'') : (c.valor_previsto??'');
  document.getElementById('pg-data').value  = pg ? (pg.pago_em||hojeISO()) : hojeISO();
  document.getElementById('mp-desfazer').style.display = pg ? 'block' : 'none';
  document.getElementById('modal-pagamento').classList.add('show');
}

async function salvarPagamento(){
  const id = document.getElementById('pg-id').value;
  const contaId = document.getElementById('pg-conta-id').value;
  const valor = document.getElementById('pg-valor').value;
  const dados = {
    conta_fixa_id: contaId,
    competencia: mesSel,
    valor_pago: valor==='' ? null : Number(valor),
    pago_em: document.getElementById('pg-data').value || hojeISO()
  };
  let error;
  if(id){
    ({ error } = await sb.from('pagamentos').update(dados).eq('id', id));
  } else {
    dados.registrado_por = EU.id;
    ({ error } = await sb.from('pagamentos').insert(dados));
  }
  if(error){ toast('Erro ao registrar 😕'); console.error(error); return; }
  fechar('modal-pagamento');
  await carregarTudo();
  toast('Pagamento registrado! ✅');
}

async function desfazerPagamento(){
  const id = document.getElementById('pg-id').value;
  if(!id) return;
  if(!confirm('Marcar esta conta como NÃO paga neste mês?')) return;
  await sb.from('pagamentos').delete().eq('id', id);
  fechar('modal-pagamento');
  await carregarTudo();
  toast('Marcada como não paga.');
}

/* ============================================================
   TELA INÍCIO
   ============================================================ */
function somaDias(iso, n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diaSemanaCurto(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''); }
function papelDe(id){ const p=PERFIS.find(x=>x.id===id); return p ? p.papel : null; }
function classePessoa(id){ const pa=papelDe(id); return pa==='gestora'?'pessoa-gestora':pa==='estagiaria'?'pessoa-estagiaria':'pessoa-nenhum'; }
function mesesEntre(deIso, ateIso){ return [...new Set([deIso.slice(0,7), ateIso.slice(0,7)])]; }
function contasNoIntervalo(deIso, ateIso){
  const res=[];
  for(const c of CONTAS){
    for(const comp of mesesEntre(deIso, ateIso)){
      const venc=dataVencimento(comp, c.dia_vencimento);
      if(venc>=deIso && venc<=ateIso) res.push({ conta:c, venc, pago: !!pagoDe(c.id, comp) });
    }
  }
  return res.sort((a,b)=> a.venc<b.venc?-1:1);
}
function itensDoDia(iso){
  const tarefas=TAREFAS.filter(t=>t.prazo===iso);
  const contas=CONTAS.filter(c=> dataVencimento(iso.slice(0,7), c.dia_vencimento)===iso);
  return { tarefas, contas };
}

function renderInicio(){
  renderSaudacao(); renderTiles(); renderCalendario(); renderSemana(); renderProximosVenc(); renderHoje();
}

function renderSaudacao(){
  const h=+new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo',hour:'2-digit',hour12:false});
  const s=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const nome=(EU.nome||'').split(' ')[0]||'';
  let data=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Sao_Paulo'});
  data=data.charAt(0).toUpperCase()+data.slice(1);
  document.getElementById('saudacao').innerHTML=`<h2>${s}, ${escapar(nome)} 👋</h2><p>${data}</p>`;
}

function renderTiles(){
  const hoje=hojeISO(), ate=somaDias(hoje,7);
  const abertas=TAREFAS.filter(t=>t.status!=='concluida');
  const nHoje=abertas.filter(t=>t.prazo===hoje).length;
  const nAtr =abertas.filter(t=>t.prazo && t.prazo<hoje).length;
  const nSem =abertas.filter(t=>t.prazo && t.prazo>hoje && t.prazo<=ate).length;
  const nVenc=contasNoIntervalo(hoje,ate).filter(x=>!x.pago).length;
  document.getElementById('tiles').innerHTML=`
    <div class="tile t-laranja" onclick="irPara('hoje')"><div class="num">${nHoje}</div><div class="rot">📅 Tarefas hoje</div></div>
    <div class="tile t-vermelho" onclick="irPara('hoje')"><div class="num">${nAtr}</div><div class="rot">⚠️ Atrasadas</div></div>
    <div class="tile" onclick="verAba('contas')"><div class="num">${nVenc}</div><div class="rot">💰 Contas a vencer</div></div>
    <div class="tile t-verde" onclick="irPara('semana')"><div class="num">${nSem}</div><div class="rot">🗓️ Na semana</div></div>`;
}
function irPara(quando){ verAba('tarefas'); setFiltro('quando', quando); }

/* ---------- Calendário ---------- */
function renderCalendario(){
  document.getElementById('cal-label').textContent=nomeMes(calMes);
  const [a,m]=calMes.split('-').map(Number);
  const primeiro=new Date(a,m-1,1).getDay();
  const nd=diasNoMes(calMes);
  const hoje=hojeISO();
  const dows=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const ordem={alta:0,media:1,baixa:2};
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<primeiro;i++) html+=`<div class="cal-cell vazia"></div>`;
  for(let dia=1;dia<=nd;dia++){
    const iso=`${calMes}-${String(dia).padStart(2,'0')}`;
    const {tarefas,contas}=itensDoDia(iso);
    const abertas=tarefas.filter(t=>t.status!=='concluida');
    const temItens=tarefas.length||contas.length;
    const prios=[...new Set(abertas.map(t=>t.prioridade))].sort((x,y)=>ordem[x]-ordem[y]);
    const dots=prios.slice(0,3).map(p=>`<span class="dot ${p}"></span>`).join('');
    const cnt=abertas.length?`<span class="cal-cnt">${abertas.length}</span>`:'';
    const money=contas.length?`<span class="cal-money">💰</span>`:'';
    const cls=['cal-cell']; if(temItens) cls.push('tem'); if(iso===hoje) cls.push('hoje');
    const hnd=temItens?`onmouseover="abrirDia(event,'${iso}')" onmouseout="fecharPopHover()" onclick="abrirDia(event,'${iso}',true)"`:'';
    html+=`<div class="${cls.join(' ')}" ${hnd}><span class="dnum">${dia}</span>${cnt}<div class="cal-dots">${dots}</div>${money}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}
function calMudarMes(d){ let [a,m]=calMes.split('-').map(Number); m+=d; if(m<1){m=12;a--;} if(m>12){m=1;a++;} calMes=`${a}-${String(m).padStart(2,'0')}`; fecharPop(); renderCalendario(); }
function calHoje(){ calMes=mesAtual(); fecharPop(); renderCalendario(); }

let popPinned=false;
function abrirDia(evt, iso, pin){
  const {tarefas,contas}=itensDoDia(iso);
  if(!tarefas.length && !contas.length) return;
  const sE={a_fazer:'◻️',fazendo:'🔵',concluida:'✅'};
  let h=`<h4>${diaSemanaCurto(iso)}, ${fmtData(iso).slice(0,5)}</h4>`;
  tarefas.forEach(t=>{
    h+=`<div class="pitem"><span>${sE[t.status]||'•'}</span><span><b>${escapar(t.titulo)}</b><br><span style="color:#64748b;font-size:12px">${escapar(nomeDe(t.responsavel_id))}${t.cliente?' · '+escapar(t.cliente):''}</span></span></div>`;
  });
  contas.forEach(c=>{
    const pg=pagoDe(c.id, iso.slice(0,7));
    h+=`<div class="pitem"><span>💰</span><span><b>${escapar(c.empresa)}</b> · ${escapar(c.nome)}<br><span style="color:#64748b;font-size:12px">${fmtMoeda(c.valor_previsto)} · ${pg?'pago ✅':'a pagar'}</span></span></div>`;
  });
  const pop=document.getElementById('cal-pop');
  pop.innerHTML=h; pop.hidden=false;
  const cell=evt.currentTarget, wrap=pop.parentElement;
  const popW=pop.offsetWidth, popH=pop.offsetHeight;
  let left=cell.offsetLeft+cell.offsetWidth+6;
  if(left+popW>wrap.clientWidth) left=cell.offsetLeft-popW-6;
  if(left<4) left=4;
  let top=cell.offsetTop;
  if(top+popH>wrap.scrollHeight) top=Math.max(4, cell.offsetTop+cell.offsetHeight-popH);
  pop.style.left=left+'px'; pop.style.top=top+'px';
  popPinned=!!pin;
}
function fecharPop(){ const p=document.getElementById('cal-pop'); if(p) p.hidden=true; popPinned=false; }
function fecharPopHover(){ if(!popPinned) fecharPop(); }

/* ---------- Fluxo da semana ---------- */
function renderSemana(){
  const outro=PERFIS.find(p=>p.id!==EU.id);
  const nomeOutro=outro?((outro.nome||outro.email||'').split(' ')[0]||'Equipe'):'Equipe';
  document.getElementById('filtros-semana').innerHTML=
    [['todos','Todos'],['minhas','Minhas'],['equipe',nomeOutro]]
    .map(([v,l])=>`<button class="chip ${semanaFiltro===v?'on':''}" onclick="setSemanaFiltro('${v}')">${escapar(l)}</button>`).join('');

  const hoje=hojeISO();
  const emoP={alta:'🔴',media:'🟠',baixa:'🟢'};
  let html='';
  for(let i=0;i<7;i++){
    const iso=somaDias(hoje,i);
    let tars=TAREFAS.filter(t=>t.prazo===iso && t.status!=='concluida');
    if(semanaFiltro==='minhas') tars=tars.filter(t=>t.responsavel_id===EU.id);
    else if(semanaFiltro==='equipe') tars=tars.filter(t=>t.responsavel_id && t.responsavel_id!==EU.id);
    const contas=CONTAS.filter(c=> dataVencimento(iso.slice(0,7), c.dia_vencimento)===iso);
    const chips=tars.map(t=>`<span class="chip-t ${classePessoa(t.responsavel_id)}" onclick="abrirTarefa('${t.id}')" title="${escapar(nomeDe(t.responsavel_id))}">${emoP[t.prioridade]||''} ${escapar(t.titulo)}</span>`).join('')
      + contas.map(c=>`<span class="chip-t conta">💰 ${escapar(c.empresa)}: ${escapar(c.nome)}</span>`).join('');
    const total=tars.length+contas.length;
    html+=`<div class="semana-dia ${iso===hoje?'hoje':''}">
      <div class="sd-topo">${i===0?'Hoje':diaSemanaCurto(iso)} · ${fmtData(iso).slice(0,5)}<span class="qtd">${total?total+' item(ns)':''}</span></div>
      ${total?`<div class="chips">${chips}</div>`:'<div class="sd-vazio">Nada agendado</div>'}
    </div>`;
  }
  document.getElementById('semana').innerHTML=html;
}
function setSemanaFiltro(v){ semanaFiltro=v; renderSemana(); }

/* ---------- Próximos vencimentos ---------- */
function renderProximosVenc(){
  const hoje=hojeISO(), ate=somaDias(hoje,7);
  const lista=contasNoIntervalo(hoje,ate);
  const box=document.getElementById('venc-lista');
  if(!lista.length){ box.innerHTML=`<div class="sd-vazio" style="padding:6px">Nenhuma conta vencendo nos próximos 7 dias. 👍</div>`; return; }
  box.innerHTML=lista.map(x=>`
    <div class="mini">
      <div class="mi-nome">${escapar(x.conta.empresa)} · ${escapar(x.conta.nome)}<small>vence ${fmtData(x.venc)}</small></div>
      <span class="mi-val">${fmtMoeda(x.conta.valor_previsto)}</span>
      <span class="mi-tag ${x.pago?'pago':'pend'}">${x.pago?'pago':'a pagar'}</span>
    </div>`).join('');
}

/* ---------- Tarefas de hoje ---------- */
function renderHoje(){
  const hoje=hojeISO();
  const lista=TAREFAS.filter(t=>t.prazo===hoje);
  const box=document.getElementById('hoje-lista');
  if(!lista.length){ box.innerHTML=`<div class="sd-vazio" style="padding:6px">Sem tarefas para hoje. 🎉</div>`; return; }
  const pesoP={alta:0,media:1,baixa:2};
  lista.sort((a,b)=>pesoP[a.prioridade]-pesoP[b.prioridade]);
  box.innerHTML=lista.map(t=>cardTarefa(t,hoje)).join('');
}
